<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="690" version="1.1" viewBox="0 0 1200 690" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#fafbfe" height="690" width="1200" x="0" y="0" /><rect fill="#fff" height="658" rx="18" ry="18" stroke="#cbd5e1" stroke-width="1.5" width="1168" x="16" y="16" /><rect fill="#eef4ff" height="75" rx="18" ry="18" stroke="#eef4ff" stroke-width="1.5" width="1168" x="16" y="16" /><rect fill="#eef4ff" height="13" rx="0" ry="0" stroke="#eef4ff" stroke-width="1.5" width="1168" x="16" y="78" /><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="27" font-weight="bold" text-anchor="start" x="56" y="66">在庫管理 Web アプリ</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="14" font-weight="normal" text-anchor="end" x="1146" y="63">画面イメージ（設計案）</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="17" font-weight="bold" text-anchor="start" x="72" y="160">SCR-02</text><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="35" font-weight="bold" text-anchor="start" x="72" y="210">在庫登録</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="16" font-weight="normal" text-anchor="start" x="72" y="245">新しい在庫情報を登録します。</text><rect fill="#fff" height="334" rx="10" ry="10" stroke="#cbd5e1" stroke-width="1.5" width="1056" x="72" y="280" /><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="19" font-weight="bold" text-anchor="start" x="120" y="335">在庫名</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="14" font-weight="normal" text-anchor="start" x="120" y="368">必須・1〜100文字</text><rect fill="#fff" height="60" rx="8" ry="8" stroke="#94a3b8" stroke-width="1.5" width="626" x="430" y="312" /><text fill="#9aa7b5" font-family="Noto Sans CJK JP" font-size="17" font-weight="normal" text-anchor="start" x="452" y="351">例：ペン</text><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="19" font-weight="bold" text-anchor="start" x="120" y="436">数量</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="14" font-weight="normal" text-anchor="start" x="120" y="468">必須・0〜999,999の整数</text><rect fill="#fff" height="60" rx="8" ry="8" stroke="#94a3b8" stroke-width="1.5" width="626" x="430" y="414" /><text fill="#9aa7b5" font-family="Noto Sans CJK JP" font-size="17" font-weight="normal" text-anchor="start" x="452" y="453">例：20</text><rect fill="#fff" height="43" rx="9" ry="9" stroke="#cbd5e1" stroke-width="1.5" width="125" x="797" y="526" /><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="17" font-weight="bold" text-anchor="middle" x="859.5" y="555">キャンセル</text><rect fill="#2563eb" height="43" rx="9" ry="9" stroke="#2563eb" stroke-width="1.5" width="145" x="940" y="526" /><text fill="#fff" font-family="Noto Sans CJK JP" font-size="17" font-weight="bold" text-anchor="middle" x="1012.5" y="555">登録する</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="15" font-weight="normal" text-anchor="start" x="80" y="655">入力エラー時：保存せず、エラーメッセージを表示してこの画面にとどまります。</text></svg>