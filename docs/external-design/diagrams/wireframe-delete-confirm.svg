<svg baseProfile="full" height="690" version="1.1" viewBox="0 0 1200 690" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#fafbfe" height="690" width="1200" x="0" y="0" /><rect fill="#fff" height="658" rx="18" ry="18" stroke="#cbd5e1" stroke-width="1.5" width="1168" x="16" y="16" /><rect fill="#eef4ff" height="75" rx="18" ry="18" stroke="#eef4ff" stroke-width="1.5" width="1168" x="16" y="16" /><rect fill="#eef4ff" height="13" rx="0" ry="0" stroke="#eef4ff" stroke-width="1.5" width="1168" x="16" y="78" /><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="27" font-weight="bold" text-anchor="start" x="56" y="66">在庫管理 Web アプリ</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="14" font-weight="normal" text-anchor="end" x="1146" y="63">画面イメージ（設計案）</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="17" font-weight="bold" text-anchor="start" x="72" y="160">DLG-01</text><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="35" font-weight="bold" text-anchor="start" x="72" y="210">削除確認</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="16" font-weight="normal" text-anchor="start" x="72" y="245">在庫一覧画面の上に表示する確認ダイアログです。</text><rect fill="#e2e8f0" height="326" rx="10" ry="10" stroke="#d8e0eb" stroke-width="1.5" width="1056" x="72" y="277" /><rect fill="#eef2f8" height="50" rx="10" ry="10" stroke="#eef2f8" stroke-width="1.5" width="970" x="115" y="319" /><text fill="#94a3b8" font-family="Noto Sans CJK JP" font-size="16" font-weight="normal" text-anchor="start" x="150" y="353">在庫ID　　　在庫名　　　　　数量　　　　　　　　操作</text><line stroke="#cbd5e1" stroke-width="1.5" x1="125" x2="1070" y1="420" y2="420" /><line stroke="#cbd5e1" stroke-width="1.5" x1="125" x2="1070" y1="480" y2="480" /><rect fill="#fff" height="278" rx="15" ry="15" stroke="#64748b" stroke-width="2" width="590" x="305" y="319" /><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="25" font-weight="bold" text-anchor="start" x="347" y="369">在庫情報を削除しますか？</text><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="18" font-weight="normal" text-anchor="start" x="348" y="415">対象：在庫ID 1／ペン</text><text fill="#b91c1c" font-family="Noto Sans CJK JP" font-size="16" font-weight="normal" text-anchor="start" x="348" y="455">削除すると元に戻せません。</text><line stroke="#e2e8f0" stroke-width="1.5" x1="335" x2="865" y1="488" y2="488" /><rect fill="#fff" height="43" rx="9" ry="9" stroke="#cbd5e1" stroke-width="1.5" width="140" x="535" y="518" /><text fill="#20334c" font-family="Noto Sans CJK JP" font-size="17" font-weight="bold" text-anchor="middle" x="605.0" y="547">キャンセル</text><rect fill="#b91c1c" height="43" rx="9" ry="9" stroke="#b91c1c" stroke-width="1.5" width="140" x="693" y="518" /><text fill="#fff" font-family="Noto Sans CJK JP" font-size="17" font-weight="bold" text-anchor="middle" x="763.0" y="547">削除する</text><text fill="#64748b" font-family="Noto Sans CJK JP" font-size="15" font-weight="normal" text-anchor="start" x="80" y="654">キャンセル時は削除しません。対象が存在しない場合はデータを変更せずエラーを表示します。</text></svg>