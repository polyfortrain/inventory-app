<svg baseProfile="full" height="1550px" version="1.1" viewBox="0 0 1820 1550" width="1820px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#2866A7" /></marker><marker id="arrow-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#8799AB" /></marker><marker id="impl" markerHeight="12" markerWidth="13" orient="auto" refX="12" refY="6"><path d="M 0 6 L 12 1 L 12 11 Z" fill="white" stroke="#2866A7" stroke-width="1.5" /></marker></defs><rect fill="white" height="1550" width="1820" x="0" y="0" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="31" font-weight="700" text-anchor="start" x="56" y="54">UC-04 ｜ 在庫削除シーケンス図（設計案）</text><text dominant-baseline="middle" fill="#53657B" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="56" y="94">Issue #40：削除確認後、ControllerがDAOを直接呼び出し、削除件数で結果を判定する。</text><polyline fill="none" points="56,120 1764,120" stroke="#DEE7F0" stroke-linejoin="round" stroke-width="2" /><rect fill="#E8F1FC" height="68" rx="11" ry="11" stroke="#B9CADC" stroke-width="1.7" width="270" x="20.0" y="157" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="155" y="188">ブラウザ</text><polyline fill="none" points="155,226 155,1456" stroke="#B9C9D9" stroke-dasharray="7 5" stroke-linejoin="round" stroke-width="1.7" /><rect fill="#E8F1FC" height="68" rx="11" ry="11" stroke="#B9CADC" stroke-width="1.7" width="270" x="365.0" y="157" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="500" y="188">InventoryServlet</text><polyline fill="none" points="500,226 500,1456" stroke="#B9C9D9" stroke-dasharray="7 5" stroke-linejoin="round" stroke-width="1.7" /><rect fill="#E8F6F3" height="68" rx="11" ry="11" stroke="#B9CADC" stroke-width="1.7" width="270" x="725.0" y="157" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="860" y="188">PostgresInventoryDao</text><polyline fill="none" points="860,226 860,1456" stroke="#B9C9D9" stroke-dasharray="7 5" stroke-linejoin="round" stroke-width="1.7" /><rect fill="#E8F6F3" height="68" rx="11" ry="11" stroke="#B9CADC" stroke-width="1.7" width="270" x="1070.0" y="157" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1205" y="188">DbConnection</text><polyline fill="none" points="1205,226 1205,1456" stroke="#B9C9D9" stroke-dasharray="7 5" stroke-linejoin="round" stroke-width="1.7" /><rect fill="#E8F6F3" height="68" rx="11" ry="11" stroke="#B9CADC" stroke-width="1.7" width="270" x="1455.0" y="157" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1590" y="188">PostgreSQL</text><polyline fill="none" points="1590,226 1590,1456" stroke="#B9C9D9" stroke-dasharray="7 5" stroke-linejoin="round" stroke-width="1.7" /><rect fill="#F2F6FB" height="64" rx="10" ry="10" stroke="#B9CADC" stroke-width="1.3" width="1701" x="58" y="253" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="76" y="280">ブラウザの削除確認ダイアログ：利用者が「キャンセル」を選択した場合、削除のHTTPリクエストは送信しない。</text><rect fill="#FFFFFF" height="155" rx="11" ry="11" stroke="#B76B6B" stroke-dasharray="6 5" stroke-width="1.3" width="1730" x="46" y="343" /><rect fill="#FFF4F3" height="37" rx="6" ry="6" stroke="#B76B6B" stroke-width="1" width="235" x="46" y="343" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="62" y="362">alt 削除をキャンセル</text><rect fill="#F2F6FB" height="61" rx="10" ry="10" stroke="#B9CADC" stroke-width="1.3" width="1100" x="80" y="397" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="98" y="424">DBにはアクセスしない。画面は在庫一覧のまま。</text><rect fill="#FFFFFF" height="579" rx="11" ry="11" stroke="#B9CADC" stroke-dasharray="6 5" stroke-width="1.3" width="1730" x="46" y="532" /><rect fill="#E8F6F3" height="37" rx="6" ry="6" stroke="#B9CADC" stroke-width="1" width="235" x="46" y="532" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="62" y="551">else 削除を承認</text><polyline fill="none" marker-end="url(#arrow-blue)" points="155,613 500,613" stroke="#2866A7" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="327.5" y="590">POST /inventory/delete（id）</text><polyline fill="none" marker-end="url(#arrow-blue)" points="500,685 860,685" stroke="#2866A7" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="680.0" y="662">deleteById(id)〔今後追加〕</text><polyline fill="none" marker-end="url(#arrow-blue)" points="860,758 1205,758" stroke="#2866A7" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="1032.5" y="735">open()</text><polyline fill="none" marker-end="url(#arrow-blue)" points="1205,823 1590,823" stroke="#2866A7" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="1397.5" y="800">JDBC接続</text><polyline fill="none" marker-end="url(#arrow-gray)" points="1590,877 1205,877" stroke="#8799AB" stroke-dasharray="6 5" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#53657B" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="1397.5" y="854">Connection</text><polyline fill="none" marker-end="url(#arrow-blue)" points="860,947 1590,947" stroke="#2866A7" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="1225.0" y="924">DELETE FROM inventory WHERE id = ?</text><polyline fill="none" marker-end="url(#arrow-gray)" points="1590,1005 860,1005" stroke="#8799AB" stroke-dasharray="6 5" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#53657B" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="1225.0" y="982">削除件数（0 または 1）</text><polyline fill="none" marker-end="url(#arrow-gray)" points="860,1066 500,1066" stroke="#8799AB" stroke-dasharray="6 5" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#53657B" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="680.0" y="1043">true / false</text><rect fill="#FFFFFF" height="106" rx="11" ry="11" stroke="#B9CADC" stroke-dasharray="6 5" stroke-width="1.3" width="1730" x="46" y="1141" /><rect fill="#E8F1FC" height="37" rx="6" ry="6" stroke="#B9CADC" stroke-width="1" width="235" x="46" y="1141" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="62" y="1160">alt 1件削除（true）</text><polyline fill="none" marker-end="url(#arrow-gray)" points="500,1210 155,1210" stroke="#8799AB" stroke-dasharray="6 5" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#53657B" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="327.5" y="1187">一覧へリダイレクト</text><rect fill="#FFFFFF" height="107" rx="11" ry="11" stroke="#B76B6B" stroke-dasharray="6 5" stroke-width="1.3" width="1730" x="46" y="1261" /><rect fill="#FFF4F3" height="37" rx="6" ry="6" stroke="#B76B6B" stroke-width="1" width="235" x="46" y="1261" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="62" y="1280">else 対象なし（false）</text><polyline fill="none" marker-end="url(#arrow-gray)" points="500,1330 155,1330" stroke="#8799AB" stroke-dasharray="6 5" stroke-linejoin="round" stroke-width="2.6" /><text dominant-baseline="middle" fill="#53657B" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="327.5" y="1307">エラー表示（変更なし）</text><rect fill="#FFF5E4" height="64" rx="10" ry="10" stroke="#E5CCA9" stroke-width="1.3" width="1690" x="66" y="1400" /><text dominant-baseline="middle" fill="#243247" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="84" y="1427">対象が0件の場合はデータを変更しない。存在確認はDELETE実行後の削除件数で判断できる。</text><text dominant-baseline="middle" fill="#53657B" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="60" y="1504">注：/inventory/delete と deleteById(id) は将来の設計案。現在のコードには未実装。</text></svg>